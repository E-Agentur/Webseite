# Netlify-Konfiguration
#
# Das Formular auf betroffenheit.html wird über das Attribut data-netlify="true"
# im HTML erkannt; hier stehen nur Auslieferung und Schutzkopfzeilen.

[build]
  publish = "."
  command = "node build.mjs"

# Sicherheitskopfzeilen. Die Content-Security-Policy passt zur Seite, wie sie
# gebaut ist: keine Inhalte von Dritten, Stile und Skripte nur von der eigenen
# Herkunft, ohne 'unsafe-inline'. Das Skript gegen das Farb-Aufblitzen muss
# inline im <head> stehen; es steht mit seinem Prüfwert in script-src, den
# „node build.mjs“ hier einträgt. Stile kommen ohne Ausnahme aus, seit im
# Markup keine style-Attribute mehr stehen und das Skript kein style-Element
# mehr einhängt.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), camera=(), microphone=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'sha256-qAm1D9YXWE5lgYKcbk11ZYOn1EvdA5PFz5KP8XrCpko='; style-src 'self'; img-src 'self' data:; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'"

# Die Quelldateien liegen im veröffentlichten Verzeichnis, sind aber keine
# Seiten. Ohne diesen Kopf würden sie als doppelter Inhalt indexiert.
[[headers]]
  for = "/src/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Der Dateiname der Bündel trägt einen Hash ihres Inhalts (site.<hash>.css).
# Eine Änderung erzeugt einen neuen Namen, daher darf der alte beliebig lange
# im Zwischenspeicher bleiben.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
