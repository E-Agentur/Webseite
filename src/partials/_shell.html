<script>
  /* Läuft vor dem ersten Paint. Zwei Aufgaben:
     - data-js markiert, dass Skripte laufen. Ohne die Markierung blendet das
       Stylesheet die Menü-Schaltfläche aus: Sie wird von app.js bedient und
       wäre ohne Skript eine Schaltfläche, die nichts tut.
     - data-theme setzt das gemerkte Farbschema, sonst blitzt beim Laden die
       falsche Farbe auf. */
  (function () {
    document.documentElement.setAttribute('data-js', '');
    try {
      var t = localStorage.getItem('theme');
      if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  })();
</script>
